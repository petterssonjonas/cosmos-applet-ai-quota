[package]
name = "cosmic-applet-ai-quota"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "COSMIC panel applet for AI subscription quotas and credits"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet", "a11y", "dbus-config"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
url = "2"
libc = "0.2"
